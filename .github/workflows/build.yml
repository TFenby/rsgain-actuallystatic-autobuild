name: Build

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream ref to build (tag or branch). Blank = latest upstream release."
        required: false
        default: ""

permissions:
  contents: write
  packages: write

env:
  UPSTREAM: complexlogic/rsgain
  VCPKG_COMMITTISH: a1cae005c39be7b18ba319fced856b68d7276271

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check for new upstream release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.r.outputs.version }}
      ref: ${{ steps.r.outputs.ref }}
      should_build: ${{ steps.r.outputs.should_build }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_REF" ]; then
            echo "Manual dispatch for $INPUT_REF; skipping the up-to-date check."
            echo "ref=$INPUT_REF"            >> "$GITHUB_OUTPUT"
            echo "version=${INPUT_REF#v}"    >> "$GITHUB_OUTPUT"
            echo "should_build=true"         >> "$GITHUB_OUTPUT"
            exit 0
          fi
          UP=$(gh release view --repo "$UPSTREAM" --json tagName -q .tagName)
          if MINE=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName 2>&1); then
            : # MINE now holds the tag name
          elif [ "$MINE" = "release not found" ]; then
            MINE=""
          else
            echo "::error::gh release view failed for ${{ github.repository }}: $MINE" >&2
            exit 1
          fi
          echo "upstream=$UP ours=${MINE:-none}"
          echo "ref=$UP"         >> "$GITHUB_OUTPUT"
          echo "version=${UP#v}" >> "$GITHUB_OUTPUT"
          if [ "$UP" = "$MINE" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true"  >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: check
    if: needs.check.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            triplet: x64-linux
            extra_pkgs: nasm
          - arch: arm64
            runner: ubuntu-24.04-arm
            triplet: arm64-linux
            extra_pkgs: ""
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq curl zip unzip tar build-essential git cmake \
            pkg-config python3 binutils ca-certificates file ffmpeg xz-utils \
            ${{ matrix.extra_pkgs }}

      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: complexlogic/rsgain
          ref: ${{ needs.check.outputs.ref }}
          path: upstream
          fetch-depth: 0

      - name: Checkout vcpkg overlay ports
        uses: actions/checkout@v4
        with:
          repository: complexlogic/vcpkg
          ref: rsgain
          path: overlays

      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          git clone https://github.com/microsoft/vcpkg /opt/vcpkg
          git -C /opt/vcpkg checkout "$VCPKG_COMMITTISH"
          /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S upstream -B build \
            -DCMAKE_TOOLCHAIN_FILE=/opt/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_MANIFEST_FEATURES="fmt;ffmpeg;libebur128;inih;" \
            -DVCPKG_OVERLAY_PORTS=overlays/ports \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DPACKAGE=TXZ \
            -DSTRIP_BINARY=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-static"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Verify actually static
        run: ./verify.sh build/rsgain

      - name: Package
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          V="$VERSION"
          D="rsgain-$V-linux-${{ matrix.arch }}-static"
          mkdir -p "dist/$D/presets"
          cp build/rsgain "dist/$D/rsgain"
          cp upstream/config/presets/*.ini "dist/$D/presets/"
          cp upstream/LICENSE "dist/$D/LICENSE"
          cp upstream/README.md "dist/$D/README.md"
          tar -C dist -cJf "$D.tar.xz" "$D"
          ls -la "$D.tar.xz"

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.arch }}
          path: rsgain-*-linux-${{ matrix.arch }}-static.tar.xz

      - name: Upload bare binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: build/rsgain

      - name: Upload presets
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: presets
          path: upstream/config/presets/*.ini

  publish:
    name: Publish release and image
    needs: [check, build]
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/rsgain-actuallystatic
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Guard against re-publishing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ needs.check.outputs.ref }}
        run: |
          set -euo pipefail
          if gh release view "$REF" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::Release $REF already exists on $REPO. Manual dispatch of an already-released ref is not supported: rebuilding now would push fresh (not bit-identical) image content over the published :$REF and :latest tags without any release changing to show for it. If you need to redo this version, remove the existing release and image tag first through your own deliberate action -- this workflow will not overwrite them for you. To publish a new version, dispatch with a ref that has no release yet, or leave ref blank to build the newest untagged upstream release." >&2
            exit 1
          fi
          echo "No existing release for $REF; proceeding."

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage image build context
        run: |
          set -euo pipefail
          mkdir -p ctx/presets
          cp Dockerfile ctx/Dockerfile
          cp artifacts/binary-amd64/rsgain ctx/rsgain-amd64
          cp artifacts/binary-arm64/rsgain ctx/rsgain-arm64
          cp artifacts/presets/*.ini ctx/presets/
          chmod +x ctx/rsgain-amd64 ctx/rsgain-arm64
          ls -laR ctx

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE_LC="${IMAGE,,}"
          # Only the version tag is pushed here. :latest is not touched until
          # the smoke test below passes -- otherwise a failing smoke test
          # would leave a possibly-broken image already public as :latest.
          docker buildx build --push \
            --platform linux/amd64,linux/arm64 \
            -t "$IMAGE_LC:$VERSION" \
            ctx

      - name: Smoke test the scratch image
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE_LC="${IMAGE,,}"
          # This is the fifth verify.sh assertion, which cannot run inside the
          # build container: prove the binary runs with no userland at all.
          out=$(docker run --rm "$IMAGE_LC:$VERSION" -v)
          echo "$out"
          echo "$out" | grep -q "rsgain" || { echo "scratch image did not run"; exit 1; }

      - name: Promote to latest
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE_LC="${IMAGE,,}"
          # Re-points :latest at the already-smoke-tested :$VERSION manifest
          # without rebuilding, so :latest only ever moves after verification.
          docker buildx imagetools create -t "$IMAGE_LC:latest" "$IMAGE_LC:$VERSION"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.check.outputs.ref }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE_LC="${IMAGE,,}"
          cat > notes.md <<EOF
          Actually-static build of upstream rsgain $REF.

          Zero \`NEEDED\` entries, no \`INTERP\` segment, runs in \`FROM scratch\`.
          Verified by \`verify.sh\` on every architecture before publishing.

          Container image: \`$IMAGE_LC:$VERSION\`
          EOF
          gh release create "$REF" \
            artifacts/tarball-amd64/*.tar.xz \
            artifacts/tarball-arm64/*.tar.xz \
            --title "$REF" \
            --notes-file notes.md
